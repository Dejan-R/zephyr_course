# GPIO and SPI
CONFIG_GPIO=y
CONFIG_SPI=y

# Display - ILI9341
CONFIG_DISPLAY=y
CONFIG_MIPI_DBI=y
CONFIG_MIPI_DBI_SPI=y
CONFIG_ILI9341=y

# System
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=12288

# LVGL
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y

# LVGL memory and rendering buffers
CONFIG_LV_Z_MEM_POOL_SIZE=24576
CONFIG_LV_Z_VDB_SIZE=20

# LVGL widgets and fonts
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_MONTSERRAT_18=y

# Software rendering
CONFIG_LV_USE_DRAW_SW=y

# Touch - XPT2046
CONFIG_INPUT=y
CONFIG_INPUT_XPT2046=y
CONFIG_LV_Z_POINTER_INPUT=y